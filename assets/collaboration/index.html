<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReadMD</title><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/client.css"><script defer src="/yjs.js"></script><script defer src="/session.js"></script><script defer src="/client.js"></script></head>
<body><header><strong>ReadMD</strong><span id="title"></span><span id="status" role="status" aria-live="polite"></span><button id="download" data-i18n="editor.save"></button></header>
<main><div id="editor-wrap"><textarea id="editor" spellcheck="false" aria-label="Markdown" disabled></textarea><div id="cursors" aria-hidden="true"></div></div><aside><div id="peers" aria-live="polite"></div><details><summary data-i18n="collaboration.review"></summary><textarea id="comment" data-i18n-placeholder="collaboration.comment"></textarea><button id="post" data-i18n="collaboration.post"></button><details id="suggestion"><summary data-i18n="collaboration.suggest"></summary><textarea id="replacement" data-i18n-placeholder="search.replacePlaceholder" data-i18n-aria="search.replaceLabel"></textarea><button id="propose" data-i18n="collaboration.suggest"></button></details><div id="reviews"></div></details><details id="files"><summary data-i18n="collaboration.attachments"></summary><input type="file" id="upload" hidden><button id="add-file" data-i18n="editor.browseFile"></button><div id="attachments"></div></details><details id="sharing" hidden><summary data-i18n="share.copyLink"></summary><select id="role" data-i18n-aria="collaboration.role"><option value="editor" data-i18n="collaboration.editor"></option><option value="reviewer" data-i18n="collaboration.reviewer"></option><option value="reader" data-i18n="collaboration.reader"></option></select><input id="name" maxlength="128" data-i18n-placeholder="collaboration.name"><button id="invite" data-i18n="share.copyLink"></button><textarea id="link" readonly hidden></textarea><details><summary data-i18n="collaboration.participants"></summary><div id="members"></div></details><button id="close" data-i18n="collaboration.close"></button></details></aside></main>
<footer><span data-i18n="collaboration.saveHint"></span><span data-i18n="collaboration.undoHint"></span></footer></body></html>
