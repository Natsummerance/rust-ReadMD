<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
<!-- Original document artwork retained unchanged; only the blue MD badge corners are rounded. -->
<defs>
  <image id="original-document" width="256" height="256" xlink:href="data:image/png;base64,"/>
  <mask id="paper" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
    <rect width="256" height="256" fill="white"/>
    <rect x="69" y="161" width="172" height="67" fill="black"/>
  </mask>
  <clipPath id="badge"><rect x="69" y="161" width="172" height="67" rx="12"/></clipPath>
  <clipPath id="paper-under-badge"><rect x="69" y="161" width="12" height="67"/></clipPath>
</defs>
<use xlink:href="#original-document" mask="url(#paper)"/>
<!-- Continue the existing paper edge behind the newly exposed left corners. -->
<g clip-path="url(#paper-under-badge)"><use xlink:href="#original-document" transform="translate(13 0)"/></g>
<use xlink:href="#original-document" clip-path="url(#badge)"/>
</svg>
