name: Refresh existing V0.0.7 downloads

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful release.yml workflow_dispatch run integrated into main
        required: true
        type: string
      source_commit:
        description: Exact public source commit built by that run
        required: true
        type: string
      pet_run_id:
        description: Exact PET Rust quality run for the same approved source
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: readmd-release-downloads-${{ github.repository }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANDIDATE_RUN: ${{ inputs.run_id }}
      CANDIDATE_COMMIT: ${{ inputs.source_commit }}
      CANDIDATE_PET_RUN: ${{ inputs.pet_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate the runner's existing archive inspection tools
        run: |
          for tool in unzip tar ar; do command -v "$tool"; done
          if command -v 7z >/dev/null; then
            echo "READMD_7Z_PATH=$(command -v 7z)" >> "$GITHUB_ENV"
          elif command -v 7zz >/dev/null; then
            echo "READMD_7Z_PATH=$(command -v 7zz)" >> "$GITHUB_ENV"
          else
            echo "The runner needs its existing 7-Zip inspector" >&2
            exit 1
          fi
      - name: Verify transaction recovery and source admission before release access
        run: node --test tools/test/refresh-v007-release.test.mjs
      - name: Wait for the exact approved release and PET CI runs
        run: node tools/continue-v007-release.mjs wait
      - name: Authenticate CI archives and refresh all eleven downloads without moving the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN: ${{ inputs.run_id }}
          CANDIDATE_COMMIT: ${{ inputs.source_commit }}
        run: node tools/refresh-v007-release.mjs
      - name: Publish actual download snapshot and continue existing website deployments
        run: node tools/continue-v007-release.mjs finish
      - name: Retain source, checksums and recovery receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V007-refresh-receipts-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            .cache/v007-refresh/*.json
            .cache/v007-refresh/*.md
            .cache/v007-refresh/*.txt
