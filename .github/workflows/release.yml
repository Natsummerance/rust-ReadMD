name: Multi-Platform Rust Build and Release

on:
  push:
    branches: [main]
    tags: ['v*', 'V*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build · ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: readmd.exe
            asset_name: ReadMD-windows-x64
            archive_ext: zip
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin_name: readmd
            asset_name: ReadMD-linux-x86_64
            archive_ext: tar.gz
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            bin_name: readmd
            asset_name: ReadMD-macos-arm64
            archive_ext: zip
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bin_name: readmd
            asset_name: ReadMD-macos-x64
            archive_ext: zip

    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
      READMD_PET_CUBISM_CORE: ${{ github.workspace }}/.cache/readmd-release-core.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalise version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="${RELEASE_TAG:-V$version}"
          test "${tag#[vV]}" = "$version"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Linux build dependencies (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgtk-layer-shell-dev

      # Prepare already locked dependencies separately; every compilation is offline.
      - name: Prepare locked dependency caches
        shell: bash
        run: |
          cargo fetch --locked --manifest-path rust/Cargo.toml
          cargo fetch --locked --manifest-path packages/readmd-pet-rust/Cargo.toml
          node tools/prepare-pet-core.mjs

      - name: Verify release version and frontend bundle
        shell: bash
        run: |
          test "$(tr -d '\r\n' < VERSION)" = "$APP_VERSION"
          cargo run --offline --locked --manifest-path rust/Cargo.toml -p xtask -- bundle-boot --check

      - name: Build release binary with Cargo
        run: cargo build --offline --locked --manifest-path rust/Cargo.toml --release -p readmd-kernel --target ${{ matrix.platform.target }}

      - name: Build and verify desktop pet package
        shell: bash
        run: |
          case "${{ matrix.platform.target }}" in
            *windows*) platform=windows; arch=x86_64 ;;
            *linux*) platform=linux; arch=x86_64 ;;
            aarch64*) platform=macos; arch=aarch64 ;;
            *) platform=macos; arch=x86_64 ;;
          esac
          cargo run --offline --locked --manifest-path rust/Cargo.toml -p xtask -- pet-package --platform "$platform" --arch "$arch" --output dist/pet

      - name: Install Windows Installer Tools (NSIS)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        run: |
          $pkgDir = "dist\ReadMD-windows-x64"
          New-Item -ItemType Directory -Force -Path $pkgDir
          Copy-Item "rust\target\${{ matrix.platform.target }}\release\readmd.exe" -Destination "$pkgDir\ReadMD.exe"
          Copy-Item "assets" -Destination "$pkgDir\assets" -Recurse
          Copy-Item "LICENSE" -Destination "$pkgDir\LICENSE"
          Copy-Item "README.md" -Destination "$pkgDir\README.md"
          Copy-Item "dist\pet\ReadMD-Pet-Rust.zip" -Destination "$pkgDir\ReadMD-Pet-Rust.zip" -ErrorAction Stop
          Compress-Archive -Path "$pkgDir\*" -DestinationPath "dist\${{ matrix.platform.asset_name }}.zip"
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DAPP_VERSION=$env:APP_VERSION" ReadMD.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS packaging failed" }

      - name: Package Linux Artifacts
        if: runner.os == 'Linux'
        run: |
          PKG_DIR="dist/ReadMD-linux-x86_64"
          mkdir -p "$PKG_DIR"
          cp "rust/target/${{ matrix.platform.target }}/release/readmd" "$PKG_DIR/ReadMD"
          cp -r assets "$PKG_DIR/assets"
          cp LICENSE README.md "$PKG_DIR/"
          cp dist/pet/ReadMD-Pet-Rust-linux-x86_64.zip "$PKG_DIR/"
          tar -czvf "dist/${{ matrix.platform.asset_name }}.tar.gz" -C dist/ReadMD-linux-x86_64 .

          # Build Debian / Ubuntu / UOS / Kylin .deb package
          DEB_DIR="dist/readmd_deb"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/readmd"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/512x512/apps"

          cp "rust/target/${{ matrix.platform.target }}/release/readmd" "$DEB_DIR/usr/bin/readmd"
          cp dist/pet/ReadMD-Pet-Rust-linux-x86_64.zip "$DEB_DIR/usr/share/readmd/"
          chmod +x "$DEB_DIR/usr/bin/readmd"
          cp -r assets "$DEB_DIR/usr/share/readmd/"
          if [ -f "assets/icon-256.png" ]; then
            cp "assets/icon-256.png" "$DEB_DIR/usr/share/icons/hicolor/512x512/apps/readmd.png"
          fi

          cat <<EOF > "$DEB_DIR/DEBIAN/control"
          Package: readmd
          Version: ${APP_VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0t64 | libgtk-3-0, libwebkit2gtk-4.1-0, libgtk-layer-shell0
          Maintainer: Natsummerance <https://github.com/Natsummerance/rust-ReadMD>
          Description: 100% Pure Rust Native Markdown Reader and Editor
           ReadMD is a local-first cross-platform Markdown reader and editor.
          EOF

          cat <<'EOF' > "$DEB_DIR/usr/share/applications/readmd.desktop"
          [Desktop Entry]
          Name=ReadMD
          Comment=Pure Rust Native Markdown Reader and Editor
          Exec=/usr/bin/readmd
          Icon=readmd
          Terminal=false
          Type=Application
          Categories=Office;TextEditor;Utility;
          MimeType=text/markdown;text/x-markdown;
          EOF

          dpkg-deb --build "$DEB_DIR" "dist/${{ matrix.platform.asset_name }}.deb"

      - name: Package macOS Artifacts
        if: runner.os == 'macOS'
        run: |
          APP_DIR="dist/ReadMD.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          cp "rust/target/${{ matrix.platform.target }}/release/readmd" "$APP_DIR/Contents/MacOS/ReadMD"
          cp dist/pet/ReadMD-Pet-Rust-macos-*.zip "$APP_DIR/Contents/Resources/"
          chmod +x "$APP_DIR/Contents/MacOS/ReadMD"
          if [ -f "assets/ReadMD.icns" ]; then
            cp "assets/ReadMD.icns" "$APP_DIR/Contents/Resources/readmd.icns"
          elif [ -f "assets/readmd.icns" ]; then
            cp "assets/readmd.icns" "$APP_DIR/Contents/Resources/readmd.icns"
          fi
          cp -r assets "$APP_DIR/Contents/Resources/"
          cat <<PLIST > "$APP_DIR/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>ReadMD</string>
              <key>CFBundleDisplayName</key>
              <string>ReadMD</string>
              <key>CFBundleIdentifier</key>
              <string>asia.readmd.desktop</string>
              <key>CFBundleVersion</key>
              <string>${APP_VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${APP_VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>ReadMD</string>
              <key>CFBundleIconFile</key>
              <string>readmd.icns</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST
          cd dist
          zip -r "${{ matrix.platform.asset_name }}.zip" ReadMD.app
          hdiutil create -volname "ReadMD" -srcfolder ReadMD.app -ov -format UDZO "${{ matrix.platform.asset_name }}.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.asset_name }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.dmg
            dist/*Setup*.exe

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify candidates and replace release downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node tools/publish-release.mjs --assets-dir release-assets
