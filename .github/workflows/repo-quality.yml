name: Repo quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  # A documentation push must not cancel an already frozen release candidate's
  # reusable quality run. Superseded pushes/candidates still cancel in their own lane.
  group: repo-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-space-consumers:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/p1-space-acceptance.yml

  kernel:
    name: Kernel tests · ${{ matrix.os }}
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    # Native subprocess deadlines are tested separately from the explicit
    # concurrency/stress lanes. Do not oversubscribe a small shared runner.
    env:
      # Installation admission intentionally coordinates every profile of
      # one user. Independent unit fixtures must not race over that real gate;
      # explicit cross-process contention tests still exercise concurrency.
      RUST_TEST_THREADS: 1
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Linux WebKitGTK headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev fonts-noto-cjk
      - name: Prepare locked Rust dependencies
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - name: Canonical owned test temporary directory
        run: node tools/ci-test-temp.mjs
      - name: Portable input diagnostics, package privacy and table edit ownership
        run: node --test --test-concurrency=2 --test-timeout=20000 tools/test/review-version-fence-input.test.mjs tools/test/vscode-package-privacy.test.mjs tools/test/v007-table-cell.test.cjs
      - name: Prepare reviewed native Node input and immutable offline pack
        run: node tools/ci-prepare-node-runtime.mjs
      - name: Prepare pinned Linux SVG source and dependencies
        if: runner.os == 'Linux'
        run: node tools/prepare-linux-svg-worker.mjs prepare
      - name: Build and inspect Linux SVG worker offline
        if: runner.os == 'Linux'
        run: node tools/prepare-linux-svg-worker.mjs build
      - name: Remove owned SVG source preparation
        if: always() && runner.os == 'Linux'
        run: node tools/prepare-linux-svg-worker.mjs clean
      # Exercise every subprocess test once, without competing with the large
      # entropy/storage lane. Include the parity adapter's subprocess tests too;
      # filtering only ::tests leaves those in the competing lane. Production
      # timeout limits and oversized-output expectations remain unchanged.
      - name: Native subprocess deadline lane
        run: |
          cargo test --offline --locked --manifest-path rust/Cargo.toml -p readmd-kernel --lib code_chunk_runner:: -- --test-threads=1
      - name: Actual two-process session CAS, with sanitized first-failure diagnostics
        run: node tools/test/session-cas-native.mjs
      - name: Retain actual session CAS receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1-session-CAS-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            .cache/p1-session-cas/report.json
            .cache/p1-session-cas/first-failure.log
      - name: Test kernel and xtask
        # Vision model acceptance remains a separate explicit invocation.
        # Keep the real test executable while this non-model regression lane
        # filters it instead of initializing recognition services.
        run: |
          cargo test --offline --locked --manifest-path rust/Cargo.toml -p readmd-kernel -p xtask -- --skip code_chunk_runner:: --skip ocr_macos::tests::actual_vision_recognizes_owned_probe_and_rejects_corruption
      - name: Compile the opt-in native Mac QA host without running models
        if: runner.os == 'macOS'
        run: |
          cargo check --offline --locked --manifest-path rust/Cargo.toml -p readmd-kernel --bin readmd --features native-qa
          cargo test --offline --locked --manifest-path rust/Cargo.toml -p readmd-kernel --bin readmd --features native-qa native_qa::tests -- --test-threads=1
      - name: Parse native batch phase scripts without launching an App
        if: runner.os == 'macOS'
        run: |
          node - <<'JS'
          const vm = require('node:vm'), { driver } = require('./ui-tests/macos-code-batch-system-native.cjs');
          for (const phase of ['run_save_quit','reopen_undo_close','batch_run_save_quit','batch_reopen_undo_close','empty']) new vm.Script(driver(phase, { source:'/owned/source.md', slow:'/owned/slow.md', batch:'/owned/batch.md' }));
          const chat = require('./ui-tests/macos-ai-node-system-native.cjs');
          for (const phase of chat.phases) new vm.Script(chat.driver(phase, { node:'/owned/node.md', ai:'/owned/chat.md' }, {}));
          JS
      - name: Headless build (Docker / server, no window toolkit)
        run: cargo build --offline --locked --manifest-path rust/Cargo.toml -p readmd-kernel --no-default-features
      - name: P0 review undo, exact anchors, saves and new-process recovery
        run: node tools/test/review-undo-http.cjs --repo . --bin rust/target/debug/readmd${{ runner.os == 'Windows' && '.exe' || '' }} --evidence .cache/review-undo-http
      - name: Retain real review undo and recovery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P0-review-undo-http-${{ matrix.os }}
          if-no-files-found: error
          path: .cache/review-undo-http/report.json
      - name: Build independent maintenance PDF inspector offline in the same target
        timeout-minutes: 5
        run: cargo build --offline --locked --manifest-path rust/Cargo.toml -p readmd-kernel --no-default-features --example table_pdf_inspector
      - name: P1 previous released writer cannot downgrade resource history
        run: node tools/test/review-version-fence-platform.mjs
      - name: P1 real code cancellation, HTTP and MCP lifecycle
        run: node tools/test/code-lifecycle-http-stdio.cjs --bin rust/target/debug/readmd${{ runner.os == 'Windows' && '.exe' || '' }} --evidence .cache/p1-code-lifecycle
      - name: P1 managed Node installation, cancellation, save, undo and new process
        run: node tools/test/node-runtime-http-stdio.cjs --bin rust/target/debug/readmd${{ runner.os == 'Windows' && '.exe' || '' }} --evidence .cache/p1-managed-node
      - name: P1 genuine chat streaming, cancellation, failure and new process
        run: node tools/test/ai-chat-stream-http.cjs --bin rust/target/debug/readmd${{ runner.os == 'Windows' && '.exe' || '' }} --evidence .cache/p1-ai-chat-stream
      - name: Retain actual chat stream receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1-ai-chat-stream-${{ matrix.os }}
          if-no-files-found: ignore
          path: .cache/p1-ai-chat-stream/report.json
      - name: Retain actual managed Node receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1-managed-node-${{ matrix.os }}
          if-no-files-found: ignore
          path: .cache/p1-managed-node/report.json
      - name: P1 code output, durable history and new MCP processes
        run: node tools/test/code-output-http-stdio.cjs --bin rust/target/debug/readmd${{ runner.os == 'Windows' && '.exe' || '' }} --evidence .cache/p1-code-output
      - name: P1 bounded SQL batches, one undo and new MCP processes
        run: node tools/test/code-batch-http-stdio.cjs --bin rust/target/debug/readmd${{ runner.os == 'Windows' && '.exe' || '' }} --evidence .cache/p1-code-batch
      - name: P1 MCP EOF stops owned SQL and actual Node worker
        run: node tools/test/code-mcp-eof.cjs --bin rust/target/debug/readmd${{ runner.os == 'Windows' && '.exe' || '' }} --evidence .cache/p1-code-mcp-eof
      - name: Retain actual MCP EOF receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1-code-mcp-eof-${{ matrix.os }}
          if-no-files-found: ignore
          path: .cache/p1-code-mcp-eof/report.json
      - name: Retain actual code batch receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1-code-batch-${{ matrix.os }}
          if-no-files-found: ignore
          path: .cache/p1-code-batch/report.json
      - name: P1 real Unix host exit stops its owned code worker
        if: runner.os != 'Windows'
        run: node tools/test/code-host-exit-unix.cjs --bin rust/target/debug/readmd --evidence .cache/p1-code-host-exit
      - name: Retain actual code lifecycle and output receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1-code-lifecycle-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            .cache/p1-code-lifecycle/report.json
            .cache/p1-code-output/report.json
            .cache/p1-code-host-exit/report.json
      - name: Retain version fence receipt and any first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1-version-fence-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            .cache/p1-previous-writer/source-fixture.json
            .cache/p1-previous-writer/input-diagnostics.json
            .cache/p1-previous-writer/input-cleanup.json
            .cache/p1-previous-writer/result/report.json
            .cache/p1-previous-writer/result/first-failure.json

      - name: P1 actual completion streaming, cancellation and strict protocol cases
        timeout-minutes: 5
        run: |
          node tools/test/ai-completion-stream-http.cjs --bin rust/target/debug/readmd${{ runner.os == 'Windows' && '.exe' || '' }} --evidence .cache/p1-ai-completion-stream
          node -e "const a=require('node:assert/strict'),r=require('./.cache/p1-ai-completion-stream/report.json');a.equal(r.passed,true);a(r.cases.length>0);a(r.cases.every(c=>c.passed));a.equal(r.productionAuth,true);a.equal(r.rustSourcesUnchanged,true);a.equal(r.binaryUnchanged,true);console.log(JSON.stringify({cases:r.cases.length,passed:r.cases.filter(c=>c.passed).length}));"
      - name: Retain actual completion streaming receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1-ai-completion-stream-${{ matrix.os }}
          if-no-files-found: ignore
          path: .cache/p1-ai-completion-stream/report.json
      # This strict native process overlap has an observable window on Mac.
      # One status-first task must supply its owned copy, actual probe and full
      # independent digest. Original timing budgets remain unchanged.
      # All three OSes retain the regular managed Node and Rust lock-guard lanes.
      - name: P1 status-first Node Run admission, busy resampling and cancellation
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: node tools/test/node-runtime-status-fairness.cjs --bin rust/target/debug/readmd --evidence .cache/p1-node-status-fairness
      - name: Retain actual Node status fairness receipt
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: P1-node-status-fairness-${{ matrix.os }}
          if-no-files-found: ignore
          path: .cache/p1-node-status-fairness/report.json
      - name: P1 actual editable PPTX tables and frozen snapshot preview
        timeout-minutes: 5
        run: |
          node tools/test/v007-pptx-table-style.cjs --bin rust/target/debug/readmd${{ runner.os == 'Windows' && '.exe' || '' }} --evidence .cache/p1-pptx-table-style
          node -e "const a=require('node:assert/strict'),r=require('./.cache/p1-pptx-table-style/report.json');a.equal(r.passed,true);a.equal(r.exports.length,5);a(r.checks.every(c=>c.pass));a(r.exports.every(c=>c.previewUsesFrozenSnapshot));a.equal(r.binaryUnchanged,true);a.equal(r.sourceUnchanged,true);a.equal(r.officePixelsCertified,false);"
      - name: Retain actual PPTX files, fixed inputs and frozen preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1-pptx-table-style-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            .cache/p1-pptx-table-style/report.json
            .cache/p1-pptx-table-style/first-failure.json
            .cache/p1-pptx-table-style/fixed-inputs.json
            .cache/p1-pptx-table-style/*-slides.xml
            .cache/p1-pptx-table-style/*-preview.html
            .cache/p1-pptx-table-style/documents/*.pptx
            .cache/p1-pptx-table-style/documents/*.md
      - name: P1 actual DOCX and native PDF HTML table safety through independent reader
        timeout-minutes: 5
        env:
          READMD_TEST_PDF_INSPECTOR: ${{ github.workspace }}/rust/target/debug/examples/table_pdf_inspector${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          node tools/test/v007-table-export-safety.cjs --bin rust/target/debug/readmd${{ runner.os == 'Windows' && '.exe' || '' }} --evidence .cache/p1-table-export-safety
          node -e "const a=require('node:assert/strict'),r=require('./.cache/p1-table-export-safety/report.json');a.equal(r.passed,true);a.equal(r.checks.length,96);a(r.checks.every(c=>c.pass));a.equal(r.pdfInspections.length,5);a.equal(r.pdfInspectorExecutableUnchanged,true);a.equal(r.binaryUnchanged,true);a.equal(r.sourceUnchanged,true);"
      - name: Retain original HTML table matrix, physical exports and independent reader receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1-table-export-safety-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            .cache/p1-table-export-safety/report.json
            .cache/p1-table-export-safety/first-failure.json
            .cache/p1-table-export-safety/independent-expectations.json
            .cache/p1-table-export-safety/*-docx.xml
            .cache/p1-table-export-safety/*-pdf-text.json
            .cache/p1-table-export-safety/documents/*.docx
            .cache/p1-table-export-safety/documents/*.pdf
            .cache/p1-table-export-safety/documents/*.md
      # Keep this exact physical-PDF unit distinct from the 96-check real
      # HTTP matrix. Both use independent locked Rust pdf_extract, without
      # calling product PDF import/OCR.
      - name: P1 native HTML table physical PDF cells through independent Rust reader
        shell: bash
        timeout-minutes: 5
        run: |
          node - <<'JS'
          const fs=require('node:fs'),cp=require('node:child_process'),assert=require('node:assert/strict');
          const root='.cache/p1-native-table-pdf',name='md_ast::html_table_tests::native_html_table_rust_pdf_uses_existing_native_table_json_and_retains_all_body_markers';
          fs.mkdirSync(root,{recursive:true});
          const result=cp.spawnSync('cargo',['test','--offline','--locked','--manifest-path','rust/Cargo.toml','-p','readmd-kernel','--lib',name,'--','--exact','--test-threads=1'],{encoding:'utf8',maxBuffer:8*1048576});
          const log=(result.stdout||'')+(result.stderr||'');fs.writeFileSync(root+'/test.log',log,{flag:'wx'});process.stdout.write(log);
          const passed=result.status===0&&/test result: ok\. 1 passed; 0 failed; 0 ignored/.test(log);
          fs.writeFileSync(root+'/report.json',JSON.stringify({passed,test:name,reader:'locked Rust pdf_extract',physicalPdf:true,http96Certified:false,productPdfImportUsed:false,modelsRequested:false,status:result.status,signal:result.signal,error:result.error?.code||null},null,2)+'\n',{flag:'wx'});
          assert(passed,'exact physical-PDF test must run once and pass; empty selection is invalid');
          JS
      - name: Retain independent physical PDF test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1-native-table-pdf-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            .cache/p1-native-table-pdf/report.json
            .cache/p1-native-table-pdf/test.log

  frontend:
    name: Frontend gates
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Prepare locked Rust dependencies
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - name: Status-first observation and deadline controls
        run: node --test tools/test/node-runtime-status-observer.test.cjs
      - name: Boot bundle is up to date
        run: cargo run --offline --locked --quiet --manifest-path rust/Cargo.toml -p xtask -- bundle-boot --check
      - name: i18n keys and literals
        run: node tools/check-i18n.mjs
      - name: Syntax check sources
        run: for f in assets/app.js assets/readmd.boot.js $(git ls-files 'assets/js/*.js'); do node --check "$f"; done
      - name: Style tokens and contrast (ratchet)
        run: node tools/check-styles.mjs
      - name: Control wiring and accessible names
        run: node tools/check-wiring.mjs
      - name: No Python in build, release or runtime paths
        run: node tools/check-no-python.mjs
      - name: Vendored assets, provider catalog and prompt policy
        run: node tools/check-assets.mjs --check
      - name: Privacy scan
        run: node tools/privacy-scan.mjs
      - name: Node tests
        run: node --test tests/frontend/toolbar.test.mjs tests/test_dragdrop_dispatch.js tools/test/check-styles.test.mjs tools/test/check-wiring.test.mjs tools/test/check-no-python.test.mjs tools/test/privacy-scan.test.mjs tools/test/check-assets.test.mjs tools/test/release-contract.test.mjs tools/test/publish-release.test.mjs tools/test/i18n-add.test.mjs tools/test/zip.test.mjs tools/test/native-build-env.test.mjs tools/test/reader-local-paths.test.mjs tools/test/local-image-auth.test.cjs tools/test/native-picker.test.mjs tools/test/deferred-model-modules.test.cjs tools/test/native-capability-ready.test.cjs tools/test/native-window-preferences.test.cjs tools/test/plugin-panel-readiness.test.cjs tools/test/macos-sign.test.mjs tools/test/native-startup-ready.test.mjs tools/test/refresh-macos-release.test.mjs ui-tests/native-auth-bootstrap.test.cjs ui-tests/native-quit-queue.test.cjs
      - name: P0 lifecycle ownership and recovery guards
        run: node --test ui-tests/close-confirm-adapter.test.cjs ui-tests/close-save-target-adapter.test.cjs ui-tests/lifecycle-order-adapter.test.cjs ui-tests/session-cas-adapter.test.cjs ui-tests/session-load-barrier.test.cjs ui-tests/durable-review-adapter.test.cjs
      - name: Formula source ownership and editor byte protections
        run: node --test tools/test/math-document-context-frontend.test.cjs tools/test/math-source-only-frontend.test.cjs
      - name: Managed Node input and streaming package regressions
        run: node --test tools/test/node-runtime-preparation.test.mjs tools/test/stream-capability-pack.test.mjs tools/test/capability-publication.test.mjs
      - name: Strict chat stream and conversation ownership regressions
        run: node --test --test-timeout=10000 ui-tests/ai-chat-stream.test.cjs ui-tests/ai-harness-adapter.test.cjs

      - name: Strict inline completion protocol and ownership VM regressions
        timeout-minutes: 2
        run: |
          node -e "require('node:fs').mkdirSync('.cache',{recursive:true})"
          node --test --test-timeout=10000 --test-reporter=tap --test-reporter-destination=.cache/p1-ai-inline-vm.tap ui-tests/ai-inline-stream.test.cjs
      - name: Retain strict inline completion VM TAP receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1-ai-inline-vm
          if-no-files-found: ignore
          path: .cache/p1-ai-inline-vm.tap

  integrations:
    name: VS Code and MCP quality
    # Playwright 1.54.0 is locked to its supported browser images.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: playwright-1.54-ubuntu-24.04
      - name: Prepare locked test toolchains
        run: |
          cargo fetch --locked --manifest-path rust/Cargo.toml
          npm ci --ignore-scripts --prefix packages/vscode-extension
          npm ci --ignore-scripts --prefix ui-tests
          npm ci --ignore-scripts --prefix website
          cd ui-tests
          npx --no-install playwright install --with-deps chromium webkit
      - name: Compile and test integrations offline
        run: |
          cargo build --offline --locked --manifest-path rust/Cargo.toml -p readmd-kernel --no-default-features
          npm test --prefix packages/vscode-extension
      - name: Extension Host preparation rejects missing and stale compilation
        run: node --test ui-tests/openapi-preflight.test.cjs tools/test/interop-diagnostics.test.cjs
      - name: Real MCP stdio and concurrency acceptance
        env:
          READMD_BIN: ${{ github.workspace }}/rust/target/debug/readmd
          READMD_ASSETS_DIR: ${{ github.workspace }}/assets
          READMD_MCP_TEST_ROOT: ${{ github.workspace }}/.cache/integration-mcp
        run: node packages/mcp-server/test/stdio.mjs
      - name: Durable review and export task MCP workflows
        env:
          READMD_BIN: ${{ github.workspace }}/rust/target/debug/readmd
        run: |
          node tools/test/durable-review-stdio.cjs
          node tools/test/export-harness-stdio.cjs
      - name: Offline preview, formulas and engineering diagrams
        working-directory: ui-tests
        env:
          READMD_PRESENTATION_TEST_ROOT: ${{ github.workspace }}/.cache/integration-mcp
        run: npx --no-install playwright test --config vscode-preview.config.cjs
      - name: Package integrations without downloads
        run: node tools/package-integrations.mjs dist/integrations
      - name: Build website offline and verify scroll video in Chrome
        env:
          NODE_PATH: ${{ github.workspace }}/ui-tests/node_modules
          READMD_MOTION_CHANNEL: chrome
          READMD_AI_SITE_CHANNEL: chrome
        run: |
          node --test website/tools/published-release.test.mjs website/tools/ai-pages.test.mjs website/tools/showcase-history.test.mjs
          npm run verify:release --prefix website
          node website/tools/motion-smoke.cjs
          node website/tools/ai-smoke.cjs
      - name: Upload integration packages
        uses: actions/upload-artifact@v4
        with:
          name: ReadMD-integrations
          if-no-files-found: error
          path: |
            dist/integrations/*.vsix
            dist/integrations/*.zip

  ui:
    name: UI quality (Playwright)
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: playwright-1.54-ubuntu-24.04
      - name: Prepare locked Rust dependencies
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - name: Prepare reviewed native Node input and immutable offline pack
        run: node tools/ci-prepare-node-runtime.mjs
      - name: Build headless kernel
        run: cargo build --offline --locked --manifest-path rust/Cargo.toml -p readmd-kernel --no-default-features
      - name: Install Playwright
        working-directory: ui-tests
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Modal, task and layout checks
        working-directory: ui-tests
        env:
          READMD_BIN: ${{ github.workspace }}/rust/target/debug/readmd
          READMD_PANEL_TEST_LOCALES: zh-CN,en,zh-TW,de,ar
          READMD_PANEL_TEST_THEMES: light,dark,sepia
        run: npx --no-install playwright test ui-quality.spec.js interaction-regressions.spec.js ai-model-discovery.spec.js all-panels-layout.spec.js editor-layout-production.spec.js language-production.spec.js panel-ux-production.spec.js community-upgrade.spec.js document-intelligence.spec.js formula-studio.spec.js --project=desktop --project=mobile
      - name: P1 real code output in the production browser UI
        env:
          READMD_CODE_BROWSER: chromium
        run: node tools/test/code-output-browser.cjs --bin rust/target/debug/readmd --evidence .cache/p1-code-output-browser
      - name: P1 bounded SQL batch in the production browser UI
        env:
          READMD_CODE_BROWSER: chromium
        run: node tools/test/code-batch-browser.cjs --bin rust/target/debug/readmd --evidence .cache/p1-code-batch-browser
      - name: P1 completed code cannot invalidate a pending dirty-close choice
        env:
          READMD_CODE_BROWSER: chromium
