name: Repo quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: repo-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel:
    name: Kernel tests · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Native subprocess deadlines are tested separately from the explicit
    # concurrency/stress lanes. Do not oversubscribe a small shared runner.
    env:
      RUST_TEST_THREADS: 4
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Linux WebKitGTK headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev fonts-noto-cjk
      - name: Prepare locked Rust dependencies
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - name: Canonical owned test temporary directory
        run: node tools/ci-test-temp.mjs
      - name: Prepare pinned Linux SVG source and dependencies
        if: runner.os == 'Linux'
        run: node tools/prepare-linux-svg-worker.mjs prepare
      - name: Build and inspect Linux SVG worker offline
        if: runner.os == 'Linux'
        run: node tools/prepare-linux-svg-worker.mjs build
      - name: Remove owned SVG source preparation
        if: always() && runner.os == 'Linux'
        run: node tools/prepare-linux-svg-worker.mjs clean
      # Exercise every subprocess test once, without competing with the large
      # entropy/storage lane. Keep the production five-second timeouts intact.
      - name: Native subprocess deadline lane
        run: cargo test --offline --locked --manifest-path rust/Cargo.toml -p readmd-kernel --lib code_chunk_runner::tests -- --test-threads=1
      - name: Test kernel and xtask
        run: cargo test --offline --locked --manifest-path rust/Cargo.toml -p readmd-kernel -p xtask -- --skip code_chunk_runner::tests
      - name: Headless build (Docker / server, no window toolkit)
        run: cargo build --offline --locked --manifest-path rust/Cargo.toml -p readmd-kernel --no-default-features

  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Prepare locked Rust dependencies
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - name: Boot bundle is up to date
        run: cargo run --offline --locked --quiet --manifest-path rust/Cargo.toml -p xtask -- bundle-boot --check
      - name: i18n keys and literals
        run: node tools/check-i18n.mjs
      - name: Syntax check sources
        run: for f in assets/app.js assets/readmd.boot.js $(git ls-files 'assets/js/*.js'); do node --check "$f"; done
      - name: Style tokens and contrast (ratchet)
        run: node tools/check-styles.mjs
      - name: Control wiring and accessible names
        run: node tools/check-wiring.mjs
      - name: No Python in build, release or runtime paths
        run: node tools/check-no-python.mjs
      - name: Vendored assets, provider catalog and prompt policy
        run: node tools/check-assets.mjs --check
      - name: Privacy scan
        run: node tools/privacy-scan.mjs
      - name: Node tests
        run: node --test tests/frontend/toolbar.test.mjs tests/test_dragdrop_dispatch.js tools/test/check-styles.test.mjs tools/test/check-wiring.test.mjs tools/test/check-no-python.test.mjs tools/test/privacy-scan.test.mjs tools/test/check-assets.test.mjs tools/test/release-contract.test.mjs tools/test/publish-release.test.mjs tools/test/i18n-add.test.mjs tools/test/zip.test.mjs tools/test/native-build-env.test.mjs tools/test/reader-local-paths.test.mjs tools/test/macos-sign.test.mjs tools/test/native-startup-ready.test.mjs tools/test/refresh-macos-release.test.mjs ui-tests/native-auth-bootstrap.test.cjs

  integrations:
    name: VS Code and MCP quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Prepare locked test toolchains
        run: |
          cargo fetch --locked --manifest-path rust/Cargo.toml
          npm ci --ignore-scripts --prefix packages/vscode-extension
          npm ci --ignore-scripts --prefix ui-tests
          npm ci --ignore-scripts --prefix website
          cd ui-tests
          npx --no-install playwright install --with-deps chromium webkit
      - name: Compile and test integrations offline
        run: |
          cargo build --offline --locked --manifest-path rust/Cargo.toml -p readmd-kernel --no-default-features
          npm test --prefix packages/vscode-extension
      - name: Real MCP stdio and concurrency acceptance
        env:
          READMD_BIN: ${{ github.workspace }}/rust/target/debug/readmd
          READMD_ASSETS_DIR: ${{ github.workspace }}/assets
          READMD_MCP_TEST_ROOT: ${{ github.workspace }}/.cache/integration-mcp
        run: node packages/mcp-server/test/stdio.mjs
      - name: Durable review and export task MCP workflows
        env:
          READMD_BIN: ${{ github.workspace }}/rust/target/debug/readmd
        run: |
          node tools/test/durable-review-stdio.cjs
          node tools/test/export-harness-stdio.cjs
      - name: Offline preview, formulas and engineering diagrams
        working-directory: ui-tests
        env:
          READMD_PRESENTATION_TEST_ROOT: ${{ github.workspace }}/.cache/integration-mcp
        run: npx --no-install playwright test --config vscode-preview.config.cjs
      - name: Package integrations without downloads
        run: node tools/package-integrations.mjs dist/integrations
      - name: Build website offline and verify scroll video in Chrome
        env:
          NODE_PATH: ${{ github.workspace }}/ui-tests/node_modules
          READMD_MOTION_CHANNEL: chrome
          READMD_AI_SITE_CHANNEL: chrome
        run: |
          node --test website/tools/published-release.test.mjs website/tools/ai-pages.test.mjs website/tools/showcase-history.test.mjs
          npm run verify:release --prefix website
          node website/tools/motion-smoke.cjs
          node website/tools/ai-smoke.cjs
      - name: Upload integration packages
        uses: actions/upload-artifact@v4
        with:
          name: ReadMD-integrations
          if-no-files-found: error
          path: |
            dist/integrations/*.vsix
            dist/integrations/*.zip

  ui:
    name: UI quality (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Prepare locked Rust dependencies
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - name: Build headless kernel
        run: cargo build --offline --locked --manifest-path rust/Cargo.toml -p readmd-kernel --no-default-features
      - name: Install Playwright
        working-directory: ui-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Modal, task and layout checks
        working-directory: ui-tests
        env:
          READMD_BIN: ${{ github.workspace }}/rust/target/debug/readmd
          READMD_PANEL_TEST_LOCALES: zh-CN,en,zh-TW,de,ar
          READMD_PANEL_TEST_THEMES: light,dark,sepia
        run: npx playwright test ui-quality.spec.js interaction-regressions.spec.js ai-model-discovery.spec.js all-panels-layout.spec.js editor-layout-production.spec.js language-production.spec.js panel-ux-production.spec.js community-upgrade.spec.js document-intelligence.spec.js --project=desktop --project=mobile
