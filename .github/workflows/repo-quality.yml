# Diagnostic branch only: this replacement must never be merged into the P1
# quality gate. A successful run certifies one instrumented test, not all jobs.
name: Windows relay cancellation diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-relay-diagnosis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-relay-trace:
    name: One actual Windows relay cancellation test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUST_TEST_THREADS: 1
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Prepare locked dependencies before offline build
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - name: Canonical owned test temporary directory
        run: node tools/ci-test-temp.mjs
      - name: Record the actual source and Rust producer
        run: |
          git rev-parse HEAD
          rustc --version --verbose
          (Get-FileHash -Algorithm SHA256 rust/readmd-kernel/src/review_transport/network.rs).Hash
      - name: Run the original exact test once with passive trace and unchanged deadlines
        run: cargo test --offline --locked --manifest-path rust/Cargo.toml -p readmd-kernel --lib review_transport::network::tests::cancelling_an_actual_stalled_request_retires_both_relay_workers -- --exact --test-threads=1 --nocapture
