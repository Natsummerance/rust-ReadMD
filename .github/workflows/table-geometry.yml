name: Table editing and Office export
on:
  push:
    branches: ['codex/v007-table-validation-*']
    paths-ignore: ['docs/**']
  workflow_dispatch:
concurrency:
  group: table-geometry-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  table:
    name: Table workflow · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      READMD_CODE_BROWSER: ${{ matrix.os == 'ubuntu-24.04' && 'chrome' || 'chromium' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - run: cargo build --locked --offline --manifest-path rust/Cargo.toml -p readmd-kernel --no-default-features
      - name: Editor guardrails and structural actions
        run: node --test tools/test/v007-table-cell.test.cjs
      - name: Source geometry, Word and PowerPoint
        shell: bash
        run: |
          for group in table_geometry enhanced_table_exports pptx_export::table_style_tests; do
            cargo test --locked --offline --manifest-path rust/Cargo.toml -p readmd-kernel --no-default-features --lib "$group" -- --test-threads=1
          done
      - name: Browser dependencies
        working-directory: ui-tests
        run: npm ci --ignore-scripts
      - name: Check hosted Linux Chrome
        if: runner.os == 'Linux'
        run: google-chrome --version
      - if: runner.os == 'Windows'
        working-directory: ui-tests
        run: npx --no-install playwright install chromium
      - name: Edit, export, save, restart, undo and redo
        # Chrome creates a Unix socket beneath TMPDIR. Keep its pathname under
        # the sockaddr_un limit independently of the checkout directory length.
        shell: bash
        run: node ui-tests/table-geometry-browser.cjs "" "$RUNNER_TEMP/rt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-geometry-${{ runner.os }}
          path: ${{ runner.temp }}/rt/report.json
          if-no-files-found: ignore
