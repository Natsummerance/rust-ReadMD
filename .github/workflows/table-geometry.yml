name: Table editing and publication exports
on:
  push:
    branches: ['codex/v007-table-validation-*']
    paths-ignore: ['docs/**']
  workflow_dispatch:
concurrency:
  group: table-geometry-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  table:
    name: Table workflow · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      READMD_ASSETS_DIR: ${{ github.workspace }}/assets
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      READMD_CODE_BROWSER: ${{ matrix.os == 'ubuntu-24.04' && 'chrome' || 'chromium' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - run: cargo build --locked --offline --manifest-path rust/Cargo.toml -p readmd-kernel --no-default-features
      - name: Editor guardrails and structural actions
        run: node --test tools/test/v007-table-cell.test.cjs tools/test/v007-table-clipboard.test.cjs
      - name: Source geometry, Word and PowerPoint
        shell: bash
        run: |
          for group in table_geometry table_track_size enhanced_table_exports pptx_export::table_style_tests pdf_render::tests::rust_pdf_ export_snapshot_api::tests; do
            cargo test --locked --offline --manifest-path rust/Cargo.toml -p readmd-kernel --no-default-features --lib "$group" -- --test-threads=1
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent PDF and pixel inspection tools
        run: python -m pip install pdfplumber==0.11.9 Pillow==12.1.1
      - name: Prepare locked Linux PDFium runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node tools/prepare-linux-pdfium.mjs "$RUNNER_TEMP/pdfium" linux-x64
          cargo build --offline --locked --manifest-path rust/Cargo.toml -p readmd-kernel --no-default-features --features pdfium-worker --bin readmd-pdf-worker
          registry=$(dirname "$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -type d -name pdfium-render-0.9.4 -print -quit)")
          READMD_REGISTRY_SRC="$registry" READMD_PDFIUM_CRATE="$registry/pdfium-render-0.9.4" node tools/build-pdf-pack.mjs "$RUNNER_TEMP/pdfium" rust/target/debug/readmd-pdf-worker "$RUNNER_TEMP/pdfium.readmd-pack" linux-x64
      - name: Browser dependencies
        working-directory: ui-tests
        run: npm ci --ignore-scripts
      - name: Check hosted Linux Chrome
        if: runner.os == 'Linux'
        run: google-chrome --version
      - if: runner.os == 'Windows'
        working-directory: ui-tests
        run: npx --no-install playwright install chromium
      - name: Edit, export, save, restart, undo and redo
        # Chrome creates a Unix socket beneath TMPDIR. Keep its pathname under
        # the sockaddr_un limit independently of the checkout directory length.
        shell: bash
        run: node ui-tests/table-geometry-browser.cjs "" "$RUNNER_TEMP/rt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-geometry-${{ runner.os }}
          path: ${{ runner.temp }}/rt/report.json
          if-no-files-found: ignore

      - name: Drag, copy and paste, save, undo and reopen
        shell: bash
        run: node ui-tests/table-tracks-browser.cjs "" "$RUNNER_TEMP/tt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-tracks-${{ runner.os }}
          path: ${{ runner.temp }}/tt/report.json
          if-no-files-found: ignore
      - name: Default PDF, long PNG and page PNGs
        shell: bash
        run: |
          args=(--edited-table "$RUNNER_TEMP/tt" --evidence "$RUNNER_TEMP/rg" --python python)
          if [[ "$RUNNER_OS" == Linux ]]; then
            args+=(--bin rust/target/debug/readmd --pdfium-pack "$RUNNER_TEMP/pdfium.readmd-pack")
          else
            args+=(--bin rust/target/debug/readmd.exe)
          fi
          node tools/test/v007-pdf-geometry.cjs "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-geometry-${{ runner.os }}
          path: ${{ runner.temp }}/rg/
          if-no-files-found: ignore
