[package]
name = "readmd-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Rust native kernel for ReadMD: storage, documents, search, HTTP API, desktop host"

[lib]
name = "readmd_kernel"
path = "src/lib.rs"

[[bin]]
name = "readmd"
path = "src/main.rs"

[[bin]]
name = "readmd-pdf-worker"
path = "src/bin/readmd-pdf-worker.rs"
required-features = ["pdfium-worker"]

[features]
default = ["desktop"]
# tao + wry window.  `--no-default-features` builds the same kernel as a
# browser/headless server only.
desktop = ["dep:tao", "dep:wry", "dep:objc2-app-kit"]
# Opt-in native integration driver. Its code is excluded from release builds.
native-qa = ["desktop"]
mobile-ffi = []
# Loaded only by the optional capability worker, never by the default reader.
pdfium-worker = ["dep:pdfium-render"]

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
# `preserve_order`: CPython's `json.dumps` emits object keys in dict insertion
# order; the default `Map` is a `BTreeMap` and emits them alphabetically.
# `assets/js/` iterates response objects with `for...in`/`Object.keys`, which
# follows insertion order, so alphabetical keys silently reorder menus, setting
# panels and any other object-iterating render.  `indexmap` is already in
# Cargo.lock, so this stays an offline build.
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
sha2 = "=0.10.9"
percent-encoding = "=2.3.2"
walkdir = "=2.5.0"
thiserror = "=2.0.20"
# Native window; optional so a headless server (Docker, CI) builds without
# GTK/WebKitGTK.  See [features].
tao = { version = "=0.37.0", optional = true }
wry = { version = "=0.57.0", features = ["os-webview"], optional = true }
time = { version = "=0.3.44", features = ["serde-human-readable"] }
uuid = { version = "=1.18.0", features = ["v4", "serde"] }
flate2 = "=1.1.0"
base64 = "=0.22.1"
# Shared, portable image decoding. Keep only document image formats; no AVIF,
# EXR, Rayon, system codec DLLs or host image applications.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
ureq = { version = "=2.12.1", features = ["json"] }
regex = "=1.11.1"
quick-xml = "=0.42.0"
# Pure Rust YAML 1.2 parser. Stream events are budgeted before building the
# OpenAPI value tree; implicit network references and executable tags are not used.
yaml-rust2 = { version = "=0.13.0", default-features = false }
yrs = { version = "=0.28.0", features = ["sync", "small-client"] }
hayagriva = { version = "=0.10.1", features = ["csl-json"] }
# GB18030/GBK/Big5/Windows-1252 encoders for encoding-preserving saves; already
# in Cargo.lock (lopdf dependency), so the offline build is unaffected.
encoding_rs = "=0.8.41"
lazy_static = "=1.5.0"
dunce = "=1.0.5"
log = "=0.4.28"
getrandom = "=0.3.4"
tempfile = "=3.26.0"
pdf-extract = "0.12.1"
lopdf = "0.42.0"
# The credential vault (`src/crypto.rs`) speaks Fernet, AES-128-CBC + HMAC-SHA256, not GCM:
# these two are already in Cargo.lock as lopdf's transitive deps and vendored in
# ~/.cargo, so the offline build stays intact.  HMAC is hand-rolled on `sha2`
# because `hmac` is not in the tree at all.
aes = "=0.8.4"
cbc = "=0.1.2"
# TrueType parsing for PDF font subsetting and vector math; already in Cargo.lock
# (pulled in by the webview stack), so the offline build is unaffected.
ttf-parser = "=0.25.1"
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881"], optional = true }

# O_NOFOLLOW protects document resources and export sources on Unix. Use the
# exact libc already in Cargo.lock; do not depend on another crate's imports.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

# Reuse the exact AppKit binding and features already locked by tao/wry. This
# is only the desktop Mac window; server builds do not acquire a UI dependency.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "NSWindow", "NSView", "NSButton", "NSButtonCell", "NSActionCell", "NSCell", "NSControl", "NSResponder", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSApplication", "NSEvent", "NSGraphicsContext", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSImage", "block2"] }
block2 = "=0.6.2"
# Vision also serves the headless/MCP host. Recognition runs in an owned child
# of the signed ReadMD executable, so cancellation never shares ObjC objects.
objc2 = { version = "=0.6.4", features = ["exception"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSObject", "NSOperation", "NSProcessInfo", "NSString"] }
objc2-vision = { version = "=0.3.2", default-features = false, features = ["std", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNObservation", "VNTypes", "objc2-core-foundation"] }

# Windows.Media.Ocr / Windows.Data.Pdf for native OCR; the same version wry
# already pulls in, so Cargo.lock gains no new package.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Data_Pdf",
    "Win32_System_WinRT",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "=3.26.0"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
